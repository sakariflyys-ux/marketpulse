services:
  db:
    image: postgres:16-alpine
    container_name: marketpulse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: marketpulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional. The app runs without Redis; the cache layer no-ops when REDIS_URL is unset.
  # Start with: docker compose --profile redis up -d
  redis:
    image: redis:7-alpine
    container_name: marketpulse-redis
    restart: unless-stopped
    profiles: ["redis"]
    ports:
      - "6379:6379"

  # Optional: run the snapshot worker in Docker against the compose Postgres.
  # docker compose --profile worker up -d
  worker:
    build:
      context: .
      dockerfile: packages/worker/Dockerfile
    profiles: ["worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/marketpulse?schema=public
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
